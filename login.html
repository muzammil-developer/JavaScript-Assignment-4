<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <div class="container-fluid  text-center align-items-start position-fixed">

        <div class="row">

            <div class="col-sm-12 bg-success py-2">

                <div class="row w-100 m-0 ">
                    <div class="col-sm-4 text-start ps-2">

                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQz5iNo-jFihIUfEWC2AAJWKkMlebgvtvocG3pBdBXZRQ&s=10"
                            alt="my picture" class="img-fluid rounded-circle"
                            style="width: 50px; height: 50px; object-fit: cover;">
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="container vh-100  d-flex justify-content-center align-items-center ">

        <div class="row  w-100 justify-content-center">

            <div class=" col-sm-4  bg-primary text-white p-4 rounded shadow ">
                <h2 class="text-center mb-4">Login</h2>

                <form id="loginForm" novalidate>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control mb-3" id="email" placeholder="Enter your email"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="col-form-label text-white">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password"
                            required>
                    </div>

                    <div id="errorMsg" class="alert alert-danger py-2 d-none" role="alert"></div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-light text-primary fw-bold">Login</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
